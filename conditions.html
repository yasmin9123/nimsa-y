<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIMSA-Y — Launch Conditions</title><link rel="stylesheet" href="styles.css"></head><body>
<nav class="nav"><div class="shell nav-inner"><a class="brand" href="index.html"><span class="brand-mark"></span>NIMSA-Y</a><div class="nav-links"><a href="index.html">Ignition</a><a href="design.html">Design Studio</a><a class="active" href="conditions.html">Launch Conditions</a><a href="analysis.html">Flight Analysis</a></div></div></nav>
<main class="shell"><header class="page-head"><span class="eyebrow">02 / Conditions</span><h1>Launch Conditions</h1><p>Tell NIMSA-Y what the air and launch setup look like. These inputs feed the local flight-analysis prototype.</p><div class="stepbar"><div class="step done">Design</div><div class="step active">Conditions</div><div class="step">Analyze</div><div class="step">Review</div></div></header>
<form id="weatherForm" style="max-width:840px;margin-bottom:80px"><div class="form-card"><h3>Weather</h3><div class="form-grid"><div class="field"><label>Temperature (°C)</label><input name="temperature" type="number" step="0.1" required></div><div class="field"><label>Wind speed (m/s)</label><input name="wind" type="number" min="0" step="0.1" required></div><div class="field"><label>Air pressure (hPa)</label><input name="pressure" type="number" min="800" max="1100" step="1" required></div><div class="field"><label>Humidity (%)</label><input name="humidity" type="number" min="0" max="100" step="1" required></div></div></div><div class="form-card"><h3>Launch setup</h3><div class="form-grid"><div class="field"><label>Launch angle (° from horizontal)</label><input name="launchAngle" type="number" min="0" max="90" step="1" required></div><div class="field"><label>Field elevation (m)</label><input name="elevation" type="number" step="1" value="0"></div><div class="field"><label>Rail length (m)</label><input name="railLength" type="number" min="0" step="0.1" value="1.8"></div><div class="field"><label>Surface</label><select name="surface"><option value="grass">Grass field</option><option value="desert">Dry/open field</option><option value="pavement">Pavement nearby</option></select></div></div></div><div class="actions"><a class="btn btn-ghost" href="design.html">← Back to design</a><button class="btn btn-fire" type="submit">Generate launch analysis →</button></div></form></main><script src="app.js"></script></body></html>
